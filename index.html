<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0d3761" />
  <title>Magazzino Sanitario – Croce Gialla Emergenza ODV</title>
  <link rel="icon" href="https://primary.jwwb.nl/public/s/b/j/temp-jdsqfuxejozahvwvidxb/logo-ridimensionato-no-sfondo-high.png?enable=upscale&enable-io=true&height=240" />
  <style>:root{--blue:#0d3761;--blue2:#174e84;--yellow:#ffd43b;--yellow2:#ffea83;--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#64748b;--line:#dbe2ea;--red:#b42318;--green:#16794c;--orange:#b45309;--shadow:0 10px 28px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eef4fa,#fff8cf)}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow);text-align:center}.login-logo{width:142px;height:142px;object-fit:contain;border-radius:50%}.login-card h1{margin:15px 0 0;color:var(--blue);font-size:31px}.subtitle{margin:6px 0 18px;font-weight:700}.notice{background:#fff8d2;border:1px solid #f5d95f;padding:11px;border-radius:12px;font-size:14px;margin-bottom:18px}.stack{display:grid;gap:14px;text-align:left}label{font-weight:700;font-size:14px;color:#334155}input,select,textarea{width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;background:white;color:var(--text)}textarea{min-height:86px;resize:vertical}.form-msg{min-height:18px;color:var(--red);font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.primary{background:var(--yellow);color:#1e293b}.btn.secondary{background:var(--blue);color:#fff}.btn.ghost{background:#fff;color:var(--blue);border:1px solid #cbd5e1}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.topbar{height:76px;background:var(--blue);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.12)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:55px;height:55px;object-fit:contain;border-radius:50%;background:white}.brand div{display:grid}.brand strong{font-size:18px}.brand span{font-size:12px;opacity:.9}.top-actions{display:flex;align-items:center;gap:12px;font-size:13px}
.layout{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 76px)}.sidebar{background:white;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}.nav-btn{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:11px 12px;border-radius:10px;text-align:left;font-weight:750;color:#334155;cursor:pointer}.nav-btn:hover,.nav-btn.active{background:#fff4b8;color:#0b3158}.content{padding:24px;min-width:0}.page{max-width:1500px;margin:0 auto}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.page-head h2{margin:0;color:var(--blue);font-size:27px}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.metric{padding:18px}.metric .label{font-size:13px;color:var(--muted);font-weight:700}.metric .value{font-size:31px;font-weight:900;color:var(--blue);margin-top:8px}.metric.warn .value{color:var(--orange)}.metric.danger .value{color:var(--red)}.metric.good .value{color:var(--green)}.panel{padding:18px;margin-top:16px}.panel h3{margin:0 0 14px;color:var(--blue)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}th,td{padding:10px 11px;border-bottom:1px solid #e8edf2;text-align:left;vertical-align:top}th{background:#f8fafc;color:#334155;position:sticky;top:0}tr:last-child td{border-bottom:0}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#e8eef5;color:#334155}.tag.red{background:#fee2e2;color:#991b1b}.tag.yellow{background:#fef3c7;color:#92400e}.tag.green{background:#dcfce7;color:#166534}.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.toolbar label{min-width:190px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:100;padding:20px}.modal{background:white;border-radius:18px;box-shadow:var(--shadow);width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px}.modal h3{margin-top:0;color:var(--blue)}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{padding:28px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;z-index:200;background:#0f172a;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);transform:translateY(120px);opacity:0;transition:.25s}.toast.show{transform:translateY(0);opacity:1}.toast.error{background:#991b1b}.hint{font-size:12px;color:var(--muted)}.danger-text{color:var(--red);font-weight:800}.ok-text{color:var(--green);font-weight:800}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav-btn{width:auto;white-space:nowrap}.grid-2,.grid-3{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:0 12px}.brand span{display:none}}
@media(max-width:600px){.cards{grid-template-columns:1fr}.brand strong{font-size:14px}.top-actions #userLabel{display:none}.page-head{align-items:flex-start;flex-direction:column}.content{padding:12px}.login-card{padding:22px}.login-logo{width:115px;height:115px}}
@media print{.sidebar,.topbar,.actions,.toolbar,.btn{display:none!important}.layout{display:block}.content{padding:0}.panel,.card{box-shadow:none;border:0}.page{display:block!important}.page.hidden{display:none!important}body{background:white}}
</style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="loginView" class="login-shell">
    <div class="login-card">
      <img class="login-logo" src="https://primary.jwwb.nl/public/s/b/j/temp-jdsqfuxejozahvwvidxb/logo-ridimensionato-no-sfondo-high.png?enable=upscale&enable-io=true&height=240" alt="Croce Gialla Emergenza ODV" />
      <h1>Magazzino Sanitario</h1>
      <p class="subtitle">Croce Gialla Emergenza ODV</p>
      <div class="notice">Accesso riservato al Responsabile del Magazzino Sanitario</div>
      <form id="loginForm" class="stack">
        <label>Email<input id="loginEmail" type="email" autocomplete="username" value="magazzinosanitario@crocegiallaemergenza.it" readonly required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Accedi</button>
        <button class="btn ghost" type="button" id="activateBtn">Primo accesso: crea la password</button>
      </form>
      <p id="loginMsg" class="form-msg"></p>
    </div>
  </section>

  <div id="appView" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <img src="https://primary.jwwb.nl/public/s/b/j/temp-jdsqfuxejozahvwvidxb/logo-ridimensionato-no-sfondo-high.png?enable=upscale&enable-io=true&height=240" alt="Logo" />
        <div><strong>Magazzino Sanitario</strong><span>Croce Gialla Emergenza ODV</span></div>
      </div>
      <div class="top-actions"><span id="userLabel"></span><button id="logoutBtn" class="btn ghost">Esci</button></div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="nav"></nav>
      <main class="content">
        <section id="page-dashboard" class="page"></section>
        <section id="page-articoli" class="page hidden"></section>
        <section id="page-categorie" class="page hidden"></section>
        <section id="page-lotti" class="page hidden"></section>
        <section id="page-movimenti" class="page hidden"></section>
        <section id="page-scadenze" class="page hidden"></section>
        <section id="page-dotazioni" class="page hidden"></section>
        <section id="page-inventario" class="page hidden"></section>
        <section id="page-riordino" class="page hidden"></section>
        <section id="page-impostazioni" class="page hidden"></section>
      </main>
    </div>
  </div>

  <script type="module">import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://ihottewckpwpwqzpxusl.supabase.co';
const SUPABASE_KEY='sb_publishable_K7aTp6hLR_Pcpn7UGvArLg_DEgBjlH4';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const RESPONSABILE_EMAIL='magazzinosanitario@crocegiallaemergenza.it';
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('it-IT',{maximumFractionDigits:3});
const dateIt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('it-IT'):'—';
let session=null; let currentPage='dashboard'; let cache={categorie:[],articoli:[],ubicazioni:[],lotti:[]};

const navItems=[['dashboard','Dashboard','▦'],['articoli','Articoli','▤'],['categorie','Categorie','◫'],['lotti','Lotti e scadenze','◷'],['movimenti','Movimenti','⇄'],['scadenze','Scadenze','!'],['dotazioni','Dotazioni ambulanze','✚'],['inventario','Inventario','▧'],['riordino','Riordino','☑'],['impostazioni','Impostazioni','⚙']];
$('#nav').innerHTML=navItems.map(([id,l,ic])=>`<button class="nav-btn ${id==='dashboard'?'active':''}" data-page="${id}"><span>${ic}</span>${l}</button>`).join('');
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)showPage(b.dataset.page)});

function toast(msg,err=false){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' error':'');setTimeout(()=>t.className='toast',2600)}
function modal(html){const d=document.createElement('div');d.className='modal-backdrop';d.innerHTML=`<div class="modal">${html}</div>`;d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-close]'))d.remove()});document.body.appendChild(d);return d}
function pageHead(title,buttons=''){return `<div class="page-head"><h2>${title}</h2><div class="actions">${buttons}</div></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Nessun dato presente</td></tr>`}</tbody></table></div>`}
function csv(filename,heads,rows){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const body=[heads.map(q).join(';'),...rows.map(r=>r.map(q).join(';'))].join('\n');const blob=new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href)}
async function safe(q){const {data,error}=await q;if(error)throw error;return data}

async function checkAuthorized(){
 const {data,error}=await sb.from('mag_responsabili').select('email,attivo').maybeSingle();
 return !error && !!data?.attivo && String(data.email||'').toLowerCase()===RESPONSABILE_EMAIL;
}
async function boot(){
 const {data:{session:s}}=await sb.auth.getSession(); session=s;
 if(!session){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');return}
 const ok=await checkAuthorized();
 if(!ok){await sb.auth.signOut();$('#loginMsg').textContent='Questo account non è autorizzato al Magazzino Sanitario.';return}
 $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userLabel').textContent=session.user.email||'Responsabile';
 await loadBase(); await showPage('dashboard');
}
$('#loginEmail').value=RESPONSABILE_EMAIL;
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginMsg').textContent='Accesso in corso…';const {data,error}=await sb.auth.signInWithPassword({email:RESPONSABILE_EMAIL,password:$('#loginPassword').value});if(error){$('#loginMsg').textContent='Credenziali non valide oppure account non ancora attivato.';return}session=data.session;const ok=await checkAuthorized();if(!ok){await sb.auth.signOut();$('#loginMsg').textContent='Account non autorizzato.';return}$('#loginMsg').textContent='';boot()});
$('#activateBtn').addEventListener('click',async()=>{const pw=$('#loginPassword').value;if(!pw||pw.length<8){$('#loginMsg').textContent='Per il primo accesso inserisci una password di almeno 8 caratteri.';return}$('#loginMsg').textContent='Attivazione account in corso…';const {data,error}=await sb.auth.signUp({email:RESPONSABILE_EMAIL,password:pw,options:{emailRedirectTo:location.href.split('#')[0].split('?')[0]}});if(error){$('#loginMsg').textContent=error.message||'Impossibile attivare l’account.';return}if(data.session){$('#loginMsg').textContent='Account attivato. Accesso in corso…';boot()}else{$('#loginMsg').textContent='Controlla la casella email del Magazzino Sanitario e conferma l’attivazione. Dopo la conferma torna su questa pagina e accedi.';}});
$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function loadBase(){
 const [categorie,articoli,ubicazioni,lotti]=await Promise.all([
   safe(sb.from('mag_categorie').select('*').order('nome')),
   safe(sb.from('mag_articoli').select('*,mag_categorie(nome)').order('nome')),
   safe(sb.from('mag_ubicazioni').select('*').eq('attiva',true).order('ordinamento')),
   safe(sb.from('mag_lotti').select('*,mag_articoli(codice,nome,unita_misura)').order('data_scadenza',{ascending:true,nullsFirst:false}))
 ]); cache={categorie,articoli,ubicazioni,lotti};
}
async function showPage(id){currentPage=id;$$('.page').forEach(x=>x.classList.add('hidden'));$('#page-'+id).classList.remove('hidden');$$('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===id));try{await ({dashboard:renderDashboard,articoli:renderArticoli,categorie:renderCategorie,lotti:renderLotti,movimenti:renderMovimenti,scadenze:renderScadenze,dotazioni:renderDotazioni,inventario:renderInventario,riordino:renderRiordino,impostazioni:renderImpostazioni}[id]||renderDashboard)()}catch(e){console.error(e);toast(e.message||'Errore',true)}}

async function renderDashboard(){
 const [inv,mov,reint]=await Promise.all([safe(sb.from('mag_inventario').select('*')),safe(sb.from('mag_movimenti').select('*,mag_lotti(mag_articoli(nome,codice))').order('creato_il',{ascending:false}).limit(8)),safe(sb.from('mag_reintegri').select('*'))]);
 const now=new Date(), d30=new Date(now);d30.setDate(now.getDate()+30);const d60=new Date(now);d60.setDate(now.getDate()+60);const d90=new Date(now);d90.setDate(now.getDate()+90);
 const exp=cache.lotti.filter(x=>x.data_scadenza); const expired=exp.filter(x=>new Date(x.data_scadenza+'T23:59:59')<now).length;
 const within=(d)=>exp.filter(x=>{const z=new Date(x.data_scadenza+'T12:00:00');return z>=now&&z<=d}).length;
 const low=(await safe(sb.from('mag_riordino').select('*'))).length; const missing=reint.filter(x=>Number(x.quantita_mancante)>0).length;
 $('#page-dashboard').innerHTML=pageHead('Dashboard')+`<div class="cards">
  <div class="card metric"><div class="label">Articoli attivi</div><div class="value">${cache.articoli.filter(a=>a.attivo).length}</div></div>
  <div class="card metric"><div class="label">Unità complessive</div><div class="value">${fmt(inv.reduce((s,x)=>s+Number(x.quantita||0),0))}</div></div>
  <div class="card metric warn"><div class="label">Sotto scorta</div><div class="value">${low}</div></div>
  <div class="card metric danger"><div class="label">Lotti scaduti</div><div class="value">${expired}</div></div>
  <div class="card metric warn"><div class="label">Scadenze 30 giorni</div><div class="value">${within(d30)}</div></div>
  <div class="card metric"><div class="label">Scadenze 60 giorni</div><div class="value">${within(d60)}</div></div>
  <div class="card metric"><div class="label">Scadenze 90 giorni</div><div class="value">${within(d90)}</div></div>
  <div class="card metric ${missing?'danger':'good'}"><div class="label">Dotazioni da reintegrare</div><div class="value">${missing}</div></div></div>
  <div class="panel"><h3>Movimenti recenti</h3>${table(['Data','Tipo','Articolo','Quantità','Causale'],mov.map(m=>`<tr><td>${new Date(m.creato_il).toLocaleString('it-IT')}</td><td><span class="tag">${esc(m.tipo)}</span></td><td>${esc(m.mag_lotti?.mag_articoli?.codice||'')} — ${esc(m.mag_lotti?.mag_articoli?.nome||'')}</td><td>${fmt(m.quantita)}</td><td>${esc(m.causale||'')}</td></tr>`).join(''))}</div>`;
}

async function renderArticoli(){
 await loadBase();
 const p=$('#page-articoli');
 const catOptions=cache.categorie.filter(c=>c.attiva).map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
 p.innerHTML=pageHead('Articoli','<button class="btn primary" id="newArt">+ Nuovo articolo</button><button class="btn ghost" id="csvArt">CSV</button>')+
 `<div class="toolbar">
   <label style="min-width:280px">Ricerca articolo
     <input id="artSearch" type="search" placeholder="Cerca per codice, nome o fornitore…">
   </label>
   <label>Categoria
     <select id="artCategory"><option value="">Tutte le categorie</option>${catOptions}</select>
   </label>
   <div class="hint" id="artCount" style="padding:0 0 11px 4px"></div>
 </div>
 <div id="artTable"></div>`;

 const filtered=()=>{
   const q=($('#artSearch').value||'').trim().toLowerCase();
   const cat=$('#artCategory').value;
   return cache.articoli.filter(a=>{
     const hay=`${a.codice||''} ${a.nome||''} ${a.fornitore||''}`.toLowerCase();
     return (!q||hay.includes(q)) && (!cat||a.categoria_id===cat);
   });
 };
 const draw=()=>{
   const data=filtered();
   const rows=data.map(a=>`<tr><td>${esc(a.codice)}</td><td><strong>${esc(a.nome)}</strong></td><td>${esc(a.mag_categorie?.nome||'—')}</td><td>${esc(a.unita_misura)}</td><td>${fmt(a.scorta_minima)}</td><td>${esc(a.fornitore||'')}</td><td>${a.attivo?'<span class="tag green">Attivo</span>':'<span class="tag">Disattivo</span>'}</td><td><div class="actions"><button class="btn small ghost" data-edit="${a.id}">Modifica</button><button class="btn small danger" data-del-art="${a.id}">Cancella</button></div></td></tr>`).join('');
   $('#artTable').innerHTML=table(['Codice','Articolo','Categoria','U.M.','Scorta min.','Fornitore','Stato','Azioni'],rows);
   $('#artCount').textContent=`${data.length} articolo/i visualizzati su ${cache.articoli.length}`;
 };
 draw();

 $('#artSearch').addEventListener('input',draw);
 $('#artCategory').addEventListener('change',draw);
 $('#newArt').onclick=()=>articleModal();
 $('#csvArt').onclick=()=>{
   const data=filtered();
   csv('articoli.csv',['Codice','Nome','Categoria','U.M.','Scorta minima','Fornitore'],data.map(a=>[a.codice,a.nome,a.mag_categorie?.nome||'',a.unita_misura,a.scorta_minima,a.fornitore||'']));
 };
 p.onclick=async e=>{
   const eb=e.target.closest('[data-edit]');
   if(eb){articleModal(cache.articoli.find(x=>x.id===eb.dataset.edit));return}
   const db=e.target.closest('[data-del-art]');
   if(!db)return;
   const a=cache.articoli.find(x=>x.id===db.dataset.delArt);
   if(!a)return;
   if(!confirm(`Vuoi cancellare definitivamente l'articolo "${a.nome}"?\n\nSe l'articolo ha già lotti o movimenti registrati, la cancellazione verrà bloccata per conservare lo storico.`))return;
   try{
     await safe(sb.from('mag_articoli').delete().eq('id',a.id));
     toast('Articolo cancellato');
     await renderArticoli();
   }catch(er){
     const m=String(er.message||'');
     if(/foreign key|mag_lotti|violates/i.test(m))toast('Articolo non cancellato: esistono già lotti o movimenti collegati. Puoi impostarlo come Disattivo per conservarne lo storico.',true);
     else toast(m||'Impossibile cancellare l’articolo',true);
   }
 };
}
function articleModal(a={}){const m=modal(`<h3>${a.id?'Modifica':'Nuovo'} articolo</h3><form id="artForm" class="grid-2"><label>Codice<input name="codice" required value="${esc(a.codice||'')}"></label><label>Nome<input name="nome" required value="${esc(a.nome||'')}"></label><label>Categoria<select name="categoria_id"><option value="">—</option>${cache.categorie.filter(c=>c.attiva).map(c=>`<option value="${c.id}" ${a.categoria_id===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><label>Unità di misura<input name="unita_misura" value="${esc(a.unita_misura||'pz')}" required></label><label>Fornitore<input name="fornitore" value="${esc(a.fornitore||'')}"></label><label>Costo €<input name="costo" type="number" min="0" step="0.01" value="${a.costo??''}"></label><label>Scorta minima<input name="scorta_minima" type="number" min="0" step="0.001" value="${a.scorta_minima??0}"></label><label>Stato<select name="attivo"><option value="true" ${a.attivo!==false?'selected':''}>Attivo</option><option value="false" ${a.attivo===false?'selected':''}>Disattivo</option></select></label><label style="grid-column:1/-1">Note<textarea name="note">${esc(a.note||'')}</textarea></label><div class="modal-foot" style="grid-column:1/-1"><button type="button" class="btn ghost" data-close>Annulla</button><button class="btn primary">Salva</button></div></form>`);m.querySelector('#artForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const obj=Object.fromEntries(f.entries());obj.attivo=obj.attivo==='true';obj.costo=obj.costo?Number(obj.costo):null;obj.scorta_minima=Number(obj.scorta_minima||0);obj.categoria_id=obj.categoria_id||null;try{if(a.id)await safe(sb.from('mag_articoli').update(obj).eq('id',a.id));else await safe(sb.from('mag_articoli').insert(obj));m.remove();toast('Articolo salvato');renderArticoli()}catch(er){toast(er.message,true)}}}

async function renderCategorie(){await loadBase();const p=$('#page-categorie');p.innerHTML=pageHead('Categorie','<button class="btn primary" id="newCat">+ Nuova categoria</button>')+table(['Nome','Stato','Azioni'],cache.categorie.map(c=>`<tr><td><strong>${esc(c.nome)}</strong></td><td>${c.attiva?'<span class="tag green">Attiva</span>':'<span class="tag">Disattiva</span>'}</td><td><div class="actions"><button class="btn small ghost" data-catid="${c.id}">Modifica</button><button class="btn small danger" data-del-cat="${c.id}">Cancella</button></div></td></tr>`).join(''));$('#newCat').onclick=()=>catModal();p.onclick=async e=>{const eb=e.target.closest('[data-catid]');if(eb){catModal(cache.categorie.find(x=>x.id===eb.dataset.catid));return}const db=e.target.closest('[data-del-cat]');if(!db)return;const cat=cache.categorie.find(x=>x.id===db.dataset.delCat);if(!cat)return;try{const {count,error}=await sb.from('mag_articoli').select('id',{count:'exact',head:true}).eq('categoria_id',cat.id);if(error)throw error;const n=count||0;const msg=n>0?`Vuoi cancellare definitivamente la categoria "${cat.nome}"?\n\n${n} articolo/i collegato/i resteranno nel gestionale ma senza categoria.`:`Vuoi cancellare definitivamente la categoria "${cat.nome}"?`;if(!confirm(msg))return;await safe(sb.from('mag_categorie').delete().eq('id',cat.id));toast('Categoria cancellata');await renderCategorie()}catch(er){toast(er.message||'Impossibile cancellare la categoria',true)}}}
function catModal(c={}){const m=modal(`<h3>${c.id?'Modifica':'Nuova'} categoria</h3><form id="catForm" class="stack"><label>Nome<input name="nome" required value="${esc(c.nome||'')}"></label><label>Stato<select name="attiva"><option value="true" ${c.attiva!==false?'selected':''}>Attiva</option><option value="false" ${c.attiva===false?'selected':''}>Disattiva</option></select></label><div class="modal-foot"><button type="button" class="btn ghost" data-close>Annulla</button><button class="btn primary">Salva</button></div></form>`);m.querySelector('#catForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const obj={nome:f.get('nome'),attiva:f.get('attiva')==='true'};try{if(c.id)await safe(sb.from('mag_categorie').update(obj).eq('id',c.id));else await safe(sb.from('mag_categorie').insert(obj));m.remove();toast('Categoria salvata');renderCategorie()}catch(er){toast(er.message,true)}}}

async function renderLotti(){await loadBase();const p=$('#page-lotti');const rows=cache.lotti.map(l=>`<tr><td>${esc(l.mag_articoli?.codice||'')}</td><td>${esc(l.mag_articoli?.nome||'')}</td><td>${esc(l.numero_lotto||'—')}</td><td>${dateIt(l.data_scadenza)}</td><td>${expiryTag(l.data_scadenza)}</td><td><button class="btn small ghost" data-lotto="${l.id}">Modifica</button></td></tr>`).join('');p.innerHTML=pageHead('Lotti e scadenze','<button class="btn primary" id="newLot">+ Nuovo lotto</button>')+`<div class="hint" style="margin-bottom:10px">Dopo aver creato il lotto, registra il carico nella sezione Movimenti.</div>`+table(['Codice','Articolo','Lotto','Scadenza','Stato',''],rows);$('#newLot').onclick=()=>lotModal();p.addEventListener('click',e=>{const id=e.target.dataset.lotto;if(id)lotModal(cache.lotti.find(x=>x.id===id))},{once:true})}
function expiryTag(d){if(!d)return '<span class="tag">Senza scadenza</span>';const now=new Date(),z=new Date(d+'T23:59:59'),days=Math.ceil((z-now)/86400000);if(days<0)return '<span class="tag red">Scaduto</span>';if(days<=30)return `<span class="tag red">${days} gg</span>`;if(days<=90)return `<span class="tag yellow">${days} gg</span>`;return '<span class="tag green">Regolare</span>'}
function lotModal(l={}){const m=modal(`<h3>${l.id?'Modifica':'Nuovo'} lotto</h3><form id="lotForm" class="grid-2"><label>Articolo<select name="articolo_id" required><option value="">Seleziona…</option>${cache.articoli.filter(a=>a.attivo).map(a=>`<option value="${a.id}" ${l.articolo_id===a.id?'selected':''}>${esc(a.codice)} — ${esc(a.nome)}</option>`).join('')}</select></label><label>Numero lotto<input name="numero_lotto" value="${esc(l.numero_lotto||'')}"></label><label>Data scadenza<input type="date" name="data_scadenza" value="${esc(l.data_scadenza||'')}"></label><label>Note<input name="note" value="${esc(l.note||'')}"></label><div class="modal-foot" style="grid-column:1/-1"><button type="button" class="btn ghost" data-close>Annulla</button><button class="btn primary">Salva</button></div></form>`);m.querySelector('#lotForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const obj=Object.fromEntries(f.entries());obj.data_scadenza=obj.data_scadenza||null;obj.numero_lotto=obj.numero_lotto||null;obj.note=obj.note||null;try{if(l.id)await safe(sb.from('mag_lotti').update(obj).eq('id',l.id));else await safe(sb.from('mag_lotti').insert(obj));m.remove();toast('Lotto salvato');renderLotti()}catch(er){toast(er.message,true)}}}

async function renderMovimenti(){await loadBase();const p=$('#page-movimenti');const mov=await safe(sb.from('mag_movimenti').select('*,mag_lotti(numero_lotto,mag_articoli(codice,nome,unita_misura))').order('creato_il',{ascending:false}).limit(300));const loc=Object.fromEntries(cache.ubicazioni.map(x=>[x.codice,x.nome]));p.innerHTML=pageHead('Movimenti','<button class="btn primary" id="btnCarico">+ CARICO</button><button class="btn secondary" id="btnScarico">− SCARICO</button><button class="btn ghost" id="btnTrasferimento">⇄ TRASFERIMENTO</button><button class="btn ghost" id="newMov">Movimento avanzato</button><button class="btn ghost" id="csvMov">CSV</button><button class="btn ghost" onclick="window.print()">Stampa</button>')+'<div class="notice" style="text-align:left;margin-bottom:14px">Scegli l’operazione: <strong>Carico</strong> per materiale in entrata, <strong>Scarico</strong> per materiale consumato o uscito definitivamente, <strong>Trasferimento</strong> per spostarlo tra magazzino e ambulanze.</div>'+table(['Data','Tipo','Articolo / lotto','Da','A','Quantità','Causale'],mov.map(m=>`<tr><td>${new Date(m.creato_il).toLocaleString('it-IT')}</td><td><span class="tag">${esc(m.tipo)}</span></td><td>${esc(m.mag_lotti?.mag_articoli?.codice||'')} — ${esc(m.mag_lotti?.mag_articoli?.nome||'')}<br><span class="hint">Lotto ${esc(m.mag_lotti?.numero_lotto||'—')}</span></td><td>${esc(loc[m.da_ubicazione]||'—')}</td><td>${esc(loc[m.a_ubicazione]||'—')}</td><td>${fmt(m.quantita)} ${esc(m.mag_lotti?.mag_articoli?.unita_misura||'')}</td><td>${esc(m.causale||'')}</td></tr>`).join(''));$('#btnCarico').onclick=()=>movementModal({tipo:'CARICO',a:'MAG_CENTRALE'});$('#btnScarico').onclick=()=>movementModal({tipo:'SCARICO',da:'MAG_CENTRALE'});$('#btnTrasferimento').onclick=()=>movementModal({tipo:'TRASFERIMENTO',da:'MAG_CENTRALE'});$('#newMov').onclick=()=>movementModal();$('#csvMov').onclick=()=>csv('movimenti.csv',['Data','Tipo','Articolo','Lotto','Da','A','Quantità','Causale'],mov.map(m=>[new Date(m.creato_il).toLocaleString('it-IT'),m.tipo,m.mag_lotti?.mag_articoli?.nome||'',m.mag_lotti?.numero_lotto||'',loc[m.da_ubicazione]||'',loc[m.a_ubicazione]||'',m.quantita,m.causale||'']))}
function movementModal(pref={}){const types=['CARICO','SCARICO','TRASFERIMENTO','RESTITUZIONE','SMALTIMENTO','RETTIFICA_POSITIVA','RETTIFICA_NEGATIVA'];const m=modal(`<h3>Registra movimento</h3><form id="movForm" class="grid-2"><label>Tipo<select name="p_tipo" required>${types.map(t=>`<option ${pref.tipo===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Lotto<select name="p_lotto_id" required><option value="">Seleziona…</option>${cache.lotti.map(l=>`<option value="${l.id}" ${pref.lotto_id===l.id?'selected':''}>${esc(l.mag_articoli?.codice||'')} — ${esc(l.mag_articoli?.nome||'')} | lotto ${esc(l.numero_lotto||'—')} | scad. ${dateIt(l.data_scadenza)}</option>`).join('')}</select></label><label>Quantità<input name="p_quantita" type="number" step="0.001" min="0.001" required value="${pref.quantita||''}"></label><label>Origine<select name="p_da_ubicazione"><option value="">—</option>${cache.ubicazioni.map(u=>`<option value="${u.codice}" ${pref.da===u.codice?'selected':''}>${esc(u.nome)}</option>`).join('')}</select></label><label>Destinazione<select name="p_a_ubicazione"><option value="">—</option>${cache.ubicazioni.map(u=>`<option value="${u.codice}" ${pref.a===u.codice?'selected':''}>${esc(u.nome)}</option>`).join('')}</select></label><label>Causale<input name="p_causale" value="${esc(pref.causale||'')}"></label><div class="hint" style="grid-column:1/-1">CARICO e RETTIFICA_POSITIVA richiedono destinazione. SCARICO/SMALTIMENTO/RETTIFICA_NEGATIVA richiedono origine. TRASFERIMENTO/RESTITUZIONE richiedono entrambe.</div><div class="modal-foot" style="grid-column:1/-1"><button type="button" class="btn ghost" data-close>Annulla</button><button class="btn primary">Conferma movimento</button></div></form>`);m.querySelector('#movForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const args=Object.fromEntries(f.entries());args.p_quantita=Number(args.p_quantita);args.p_da_ubicazione=args.p_da_ubicazione||null;args.p_a_ubicazione=args.p_a_ubicazione||null;args.p_causale=args.p_causale||null;try{await safe(sb.rpc('mag_registra_movimento',args));m.remove();toast('Movimento registrato');renderMovimenti()}catch(er){toast(er.message,true)}}}

async function renderScadenze(){await loadBase();const p=$('#page-scadenze');const lots=cache.lotti.filter(x=>x.data_scadenza).sort((a,b)=>a.data_scadenza.localeCompare(b.data_scadenza));p.innerHTML=pageHead('Scadenze')+table(['Articolo','Lotto','Scadenza','Stato'],lots.map(l=>`<tr><td>${esc(l.mag_articoli?.codice||'')} — ${esc(l.mag_articoli?.nome||'')}</td><td>${esc(l.numero_lotto||'—')}</td><td>${dateIt(l.data_scadenza)}</td><td>${expiryTag(l.data_scadenza)}</td></tr>`).join(''))}

async function renderDotazioni(){await loadBase();const p=$('#page-dotazioni');const rows=await safe(sb.from('mag_reintegri').select('*').order('ubicazione'));p.innerHTML=pageHead('Dotazioni ambulanze','<button class="btn primary" id="newReq">+ Imposta dotazione minima</button>')+table(['Mezzo','Articolo','Minimo','Presente','Mancante',''],rows.filter(r=>r.ubicazione_codice.startsWith('MEZZO_')).map(r=>`<tr><td><strong>${esc(r.ubicazione)}</strong></td><td>${esc(r.codice)} — ${esc(r.articolo)}</td><td>${fmt(r.quantita_minima)} ${esc(r.unita_misura)}</td><td>${fmt(r.quantita_attuale)}</td><td class="${Number(r.quantita_mancante)>0?'danger-text':'ok-text'}">${fmt(r.quantita_mancante)}</td><td>${Number(r.quantita_mancante)>0?`<button class="btn small primary" data-reintegra-art="${r.articolo_id}" data-reintegra-mezzo="${r.ubicazione_codice}" data-q="${r.quantita_mancante}">Reintegra</button>`:''}</td></tr>`).join(''));$('#newReq').onclick=()=>reqModal();p.addEventListener('click',async e=>{const b=e.target.closest('[data-reintegra-art]');if(!b)return;await loadBase();const candidates=cache.lotti.filter(l=>l.articolo_id===b.dataset.reintegraArt);if(!candidates.length){toast('Prima crea un lotto per questo articolo.',true);return}movementModal({tipo:'TRASFERIMENTO',lotto_id:candidates[0].id,quantita:b.dataset.q,da:'MAG_CENTRALE',a:b.dataset.reintegraMezzo,causale:'Reintegro dotazione ambulanza'})},{once:true})}
function reqModal(){const mezzi=cache.ubicazioni.filter(u=>u.tipo==='MEZZO');const m=modal(`<h3>Dotazione minima</h3><form id="reqForm" class="grid-2"><label>Ambulanza<select name="ubicazione_codice" required>${mezzi.map(u=>`<option value="${u.codice}">${esc(u.nome)}</option>`).join('')}</select></label><label>Articolo<select name="articolo_id" required>${cache.articoli.filter(a=>a.attivo).map(a=>`<option value="${a.id}">${esc(a.codice)} — ${esc(a.nome)}</option>`).join('')}</select></label><label>Quantità minima<input name="quantita_minima" type="number" min="0" step="0.001" required></label><div class="modal-foot" style="grid-column:1/-1"><button type="button" class="btn ghost" data-close>Annulla</button><button class="btn primary">Salva</button></div></form>`);m.querySelector('#reqForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const o=Object.fromEntries(f.entries());o.quantita_minima=Number(o.quantita_minima);try{await safe(sb.from('mag_dotazioni_minime').upsert(o,{onConflict:'ubicazione_codice,articolo_id'}));m.remove();toast('Dotazione aggiornata');renderDotazioni()}catch(er){toast(er.message,true)}}}

async function renderInventario(){const p=$('#page-inventario');const inv=await safe(sb.from('mag_inventario').select('*').order('articolo'));p.innerHTML=pageHead('Inventario','<button class="btn ghost" id="csvInv">CSV</button><button class="btn ghost" onclick="window.print()">Stampa</button>')+table(['Codice','Articolo','Categoria','Lotto','Scadenza','Ubicazione','Quantità'],inv.map(x=>`<tr><td>${esc(x.codice)}</td><td>${esc(x.articolo)}</td><td>${esc(x.categoria||'')}</td><td>${esc(x.numero_lotto||'—')}</td><td>${dateIt(x.data_scadenza)}</td><td>${esc(x.ubicazione)}</td><td><strong>${fmt(x.quantita)} ${esc(x.unita_misura)}</strong></td></tr>`).join(''));$('#csvInv').onclick=()=>csv('inventario.csv',['Codice','Articolo','Categoria','Lotto','Scadenza','Ubicazione','Quantità','U.M.'],inv.map(x=>[x.codice,x.articolo,x.categoria||'',x.numero_lotto||'',x.data_scadenza||'',x.ubicazione,x.quantita,x.unita_misura]))}
async function renderRiordino(){const p=$('#page-riordino');const r=await safe(sb.from('mag_riordino').select('*').order('nome'));p.innerHTML=pageHead('Lista riordino','<button class="btn ghost" id="csvRio">CSV</button><button class="btn ghost" onclick="window.print()">Stampa</button>')+table(['Codice','Articolo','Scorta minima','Giacenza','Da ordinare'],r.map(x=>`<tr><td>${esc(x.codice)}</td><td><strong>${esc(x.nome)}</strong></td><td>${fmt(x.scorta_minima)} ${esc(x.unita_misura)}</td><td>${fmt(x.giacenza_totale)}</td><td class="danger-text">${fmt(x.quantita_suggerita)} ${esc(x.unita_misura)}</td></tr>`).join(''));$('#csvRio').onclick=()=>csv('riordino.csv',['Codice','Articolo','Scorta minima','Giacenza','Quantità suggerita','U.M.'],r.map(x=>[x.codice,x.nome,x.scorta_minima,x.giacenza_totale,x.quantita_suggerita,x.unita_misura]))}

async function renderImpostazioni(){const p=$('#page-impostazioni');const s=(await safe(sb.from('mag_impostazioni').select('*').eq('id','principale').maybeSingle()))||{};p.innerHTML=pageHead('Impostazioni')+`<div class="grid-2"><div class="panel"><h3>Logo ufficiale</h3><img id="logoPreview" src="${s.logo_path?`${SUPABASE_URL}/storage/v1/object/public/magazzino-assets/${s.logo_path}`:'https://primary.jwwb.nl/public/s/b/j/temp-jdsqfuxejozahvwvidxb/logo-ridimensionato-no-sfondo-high.png?enable=upscale&enable-io=true&height=240'}" style="width:170px;height:170px;object-fit:contain;border:1px solid var(--line);border-radius:50%;background:white"><p class="hint">Il logo incluso nell'app è quello ufficiale fornito. Puoi sostituirlo qui e renderlo condiviso su tutti i dispositivi.</p><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><button class="btn primary" id="uploadLogo" style="margin-top:10px">Carica logo</button></div><div class="panel"><h3>Sicurezza accesso</h3><p>Il gestionale non dispone di registrazione pubblica. L'accesso ai dati è consentito soltanto all'account inserito nella lista autorizzata del magazzino.</p><p class="hint">Account attuale: <strong>${esc(session?.user?.email||'')}</strong></p></div></div>`;$('#uploadLogo').onclick=async()=>{const f=$('#logoFile').files[0];if(!f){toast('Seleziona un file',true);return}const ext=f.name.split('.').pop().toLowerCase();const path=`logo-ufficiale.${ext}`;try{await safe(sb.storage.from('magazzino-assets').upload(path,f,{upsert:true,contentType:f.type}));await safe(sb.from('mag_impostazioni').update({logo_path:path,aggiornato_il:new Date().toISOString(),aggiornato_da:session.user.id}).eq('id','principale'));toast('Logo aggiornato');renderImpostazioni()}catch(er){toast(er.message,true)}}}

sb.auth.onAuthStateChange(()=>{});boot();
</script>
